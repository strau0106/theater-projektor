services:
  vote:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATA_DIR: /data
    volumes:
      - vote-data:/data

volumes:
  vote-data:
